name: Visual quality

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'scripts/visual_test.py'
      - 'scripts/requirements-visual.txt'
      - 'scripts/check_design_skills.py'
      - '.agents/**'
      - 'PRODUCT.md'
      - 'DESIGN.md'
      - 'AGENTS.md'
      - '.github/workflows/visual-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Require independent reference approval
        run: |
          if [ ! -f frontend/tests/visual/references/approved.json ]; then
            echo '::error::Visual approval is withheld. Commit independently accepted references before enabling comparison; never approve candidates to silence this gate.'
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-visual.txt
      - run: npm ci --prefix frontend
      - run: python -m pip install -r scripts/requirements-visual.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check_design_skills.py
      - run: npm run typecheck --prefix frontend
      - run: npm run build --prefix frontend
      - name: Compare approved real-component renders
        shell: bash
        run: |
          mkdir -p artifacts/design-quality/ci
          npm run start --prefix frontend -- --port 3100 > artifacts/design-quality/ci/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(120):
              try:
                  with urllib.request.urlopen('http://localhost:3100', timeout=1) as response:
                      if response.status == 200:
                          break
              except OSError:
                  time.sleep(.5)
          else:
              raise SystemExit('Next server did not start')
          PY
          python scripts/visual_test.py --output artifacts/design-quality/ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: visual-quality-evidence
          path: artifacts/design-quality/ci
          retention-days: 14
